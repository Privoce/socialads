<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>专业大咖</title>
    <script>
      (function () {
        var segment = location.pathname
          .replace(/^\//, "")
          .split("/")
          .filter(Boolean)[0];
        if (segment && segment.indexOf(".") === -1) {
          var slug = decodeURIComponent(segment);
          try {
            sessionStorage.setItem("referrerSlug", slug);
          } catch (e) {}
          location.replace(
            "/?ref=" + encodeURIComponent(slug) + location.hash
          );
        } else {
          location.replace("/" + location.search + location.hash);
        }
      })();
    </script>
  </head>
  <body></body>
</html>
