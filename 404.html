<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>专业大咖</title>
    <script>
      (function () {
        var segment = location.pathname
          .replace(/^\//, "")
          .split("/")
          .filter(Boolean)[0];
        if (segment && segment.indexOf(".") === -1) {
          sessionStorage.setItem("referrerSlug", segment);
        }
        location.replace("/" + location.search + location.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
